[package]
name = "goatd-c"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/goatd"
description = "C bindings for goatd: tree decompositions of graphs."
# Nothing here goes to crates.io; the artifacts are the shared and static
# libraries a C or C++ program links against.
publish = false

# An empty workspace table keeps this crate out of the goatd package above it,
# so it is built on its own.
[workspace]

[lib]
name = "goatd_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The checkout this crate sits in, not the crates.io release, so a change to
# the core is built and tested through the bindings before it is published.
# `goatd_version` reports this package's version, and
# `.github/scripts/check-versions.sh` keeps it equal to the core's.
goatd = { path = "../.." }
