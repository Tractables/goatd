[package]
name = "goatd-wasm"
# The crate carries the shared version like the other bindings;
# `.github/scripts/check-versions.sh` checks that it matches the core.
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/goatd"
description = "goatd built for the browser with Emscripten: a PACE .gr graph goes in, a .td decomposition comes out."
publish = false

# An empty workspace table keeps this crate out of the goatd package above it,
# so it is built on its own.
[workspace]

# Emscripten links a program, not a library: a cdylib for this target is a
# side module, which the page cannot load on its own. The binary's `main` does
# nothing and never runs; the page calls the exported functions. The output
# files are named after this binary, so the page loads goatd.js.
[[bin]]
name = "goatd"
path = "src/main.rs"

[dependencies]
# The checkout this crate sits in, not the crates.io release, so a change to
# the core is built through the page before it is published.
goatd = { path = "../.." }
