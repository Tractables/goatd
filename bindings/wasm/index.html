<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goatd in the browser</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>

<header>
  <img class="logo" src="logo.png" alt="" width="192" height="192">
  <div>
    <h1>goatd in the browser</h1>
    <p class="lede">Paste a PACE <code>.gr</code> graph and goatd returns a tree
    decomposition; the solver runs in this tab and nothing is uploaded.</p>
  </div>
</header>

<section class="card">
  <div class="io">
    <div class="graph-input">
      <label for="graph">Graph</label>
      <textarea id="graph" spellcheck="false">c a 6x6 grid; its treewidth is 6

    </div>

    <div class="controls">
      <div class="field">
        <label for="order">Construction</label>
        <select id="order">
          <option value="0">min-fill</option>
          <option value="1">min-degree</option>
          <option value="2">nested dissection</option>
          <option value="3">FlowCutter</option>
          <option value="4" selected>portfolio</option>
        </select>
      </div>
      <div class="field">
        <label for="budget">Budget (ms)</label>
        <input id="budget" type="number" min="0" value="1000">
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <input id="seed" type="number" min="0" value="0">
      </div>
      <button id="run" disabled>Decompose</button>
      <p id="status">loading the solver</p>
    </div>
  </div>
</section>

<section class="card">
  <h2>Result <span id="result-summary"></span></h2>

  <div class="panels">
    <figure class="panel">
      <figcaption>Input graph</figcaption>
      <p class="hint">Once there is a decomposition, hover a vertex to see the
      bags that hold it. They form a connected piece of the tree: the running
      intersection property.</p>
      <div id="graph-view" class="view"></div>
    </figure>
    <figure class="panel">
      <figcaption>Decomposition
        <span id="legend" class="legend" hidden><i></i>bags of the largest size</span>
      </figcaption>
      <p class="hint">Hover a bag to see it separate the graph. The vertices
      beyond each branch of the tree at that bag get a colour of their own,
      and no edge joins two colours.</p>
      <div id="tree-view" class="view"><p class="note">Press Decompose.</p></div>
    </figure>
  </div>

  <details id="raw">
    <summary>PACE <code>.td</code> output</summary>
    <pre id="output"></pre>
  </details>
</section>

</main>

<script src="goatd.js"></script>
<script src="app.js"></script>

</body>
</html>
