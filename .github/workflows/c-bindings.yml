name: C bindings

# On a version tag, also packages the header, both libraries, and the licence
# and third-party notices into a per-platform archive and attaches it to the
# GitHub release — see release.yml, which does the same job for the CLI
# binaries. The packaging steps below run on every trigger, including a pull
# request, so they are proven working before a tag needs them; only the last
# step, attaching to the release, is gated on the tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the archive for and attach it to
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # Pinned: cbindgen's output changes between releases, and the staleness
  # check below compares the committed header against it byte for byte.
  CBINDGEN_VERSION: 0.29.0

jobs:
  c-bindings:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # `target` is not passed to cargo — the runner's default toolchain
        # already builds for it — it only names the archive below.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # A tag input checks out that tag, so a re-run rebuilds and re-attaches
      # the archive for a release that already exists. Every other trigger
      # leaves ref empty, which is the action's own default checkout.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || '' }}

      # A pull request's ref name has a slash in it ("123/merge"), which
      # breaks a directory name below, so "dev" stands in for anything that
      # is not an actual release tag. IS_RELEASE gates the attach step at the
      # end; it is computed here in bash rather than in that step's own `if`,
      # because comparing the dispatch input against '' there is unreliable —
      # on every trigger except workflow_dispatch, `inputs.tag` is null, and
      # GitHub's null-vs-string casting for `!=` does not behave like a plain
      # emptiness check.
      #
      # The dispatch input reaches the script through the environment rather
      # than `${{ }}`, which would paste it into the shell before bash sees it.
      - name: Determine the archive tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
            is_release=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            is_release=true
          else
            tag="dev"
            is_release=false
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "IS_RELEASE=$is_release" >> "$GITHUB_ENV"

      # Builds the shared and the static library, and prints the system
      # libraries a static link has to name — the C++ runtime the vendored
      # FlowCutter needs among them. The example's static link uses that list
      # rather than a guess per platform.
      - name: Build the bindings
        working-directory: bindings/c
        env:
          # The note below is read by sed, and colour escapes would hide it.
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo rustc --release -- --print native-static-libs 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
          libs=$(sed -n 's/^note: native-static-libs: //p' "$RUNNER_TEMP/build.log" | head -n 1)
          test -n "$libs" || { echo "rustc printed no native-static-libs note"; exit 1; }
          echo "NATIVE_STATIC_LIBS=$libs" >> "$GITHUB_ENV"

      - name: Build and run the example (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          out=bindings/c/target/release
          case "${{ runner.os }}" in
            macOS) shared=$out/libgoatd_c.dylib ;;
            *) shared=$out/libgoatd_c.so ;;
          esac
          export LD_LIBRARY_PATH="$PWD/$out:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$PWD/$out:${DYLD_LIBRARY_PATH:-}"

          cc -std=c99 -Wall -Wextra -Ibindings/c/include \
             bindings/c/example/example.c "$shared" \
             -Wl,-rpath,"$PWD/$out" -o example-shared
          ./example-shared

          cc -std=c99 -Wall -Wextra -Ibindings/c/include \
             bindings/c/example/example.c "$out/libgoatd_c.a" \
             $NATIVE_STATIC_LIBS -o example-static
          ./example-static

      # cl.exe is not on PATH until vcvars has run, and vswhere finds the
      # installation without hard-coding the Visual Studio edition. /MD
      # matches the dynamic CRT that Rust and the vendored C++ are built
      # against.
      - name: Build and run the example (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set OUT=bindings\c\target\release

          cl /nologo /MD /W3 /Ibindings\c\include bindings\c\example\example.c ^
             /Fe:example-shared.exe /link %OUT%\goatd_c.dll.lib || exit /b 1
          copy %OUT%\goatd_c.dll . || exit /b 1
          example-shared.exe || exit /b 1

          cl /nologo /MD /W3 /Ibindings\c\include bindings\c\example\example.c ^
             /Fe:example-static.exe /link %OUT%\goatd_c.lib %NATIVE_STATIC_LIBS% || exit /b 1
          example-static.exe || exit /b 1

      - name: Check formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: bindings/c
        run: cargo fmt --check

      - name: Lint
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: bindings/c
        run: cargo clippy --release --all-targets -- -D warnings

      # The committed header is what consumers compile against, so a change to
      # src/lib.rs that is not regenerated has to fail here rather than ship.
      - name: Check the committed header against cbindgen
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          cargo install cbindgen --version "$CBINDGEN_VERSION" --locked
          cbindgen --config bindings/c/cbindgen.toml --crate goatd-c \
                   --output "$RUNNER_TEMP/goatd.h" bindings/c
          if ! diff -u bindings/c/include/goatd.h "$RUNNER_TEMP/goatd.h"; then
            echo "bindings/c/include/goatd.h is out of date."
            echo "Regenerate it with cbindgen $CBINDGEN_VERSION; the run's"
            echo "goatd-h artifact holds the expected file."
            exit 1
          fi

      - name: Upload the generated header
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: goatd-h
          path: ${{ runner.temp }}/goatd.h
          if-no-files-found: ignore

      # LICENSE and THIRD-PARTY.md travel inside the archive: the vendored
      # FlowCutter is BSD-2-Clause, and its notice has to accompany the two
      # libraries it is compiled into. NATIVE-STATIC-LIBS.txt records the
      # system libraries the static archive needs at link time, which a
      # consumer cannot guess and which differs per platform (README.md
      # documents the same command that produces it here).
      - name: Package the archive (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -eux
          out=bindings/c/target/release
          name="goatd-c-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp bindings/c/include/goatd.h LICENSE docs/THIRD-PARTY.md "$name"
          case "${{ runner.os }}" in
            macOS) cp "$out/libgoatd_c.dylib" "$name" ;;
            *) cp "$out/libgoatd_c.so" "$name" ;;
          esac
          cp "$out/libgoatd_c.a" "$name"
          {
            echo "System libraries needed when linking libgoatd_c.a statically,"
            echo "from 'cargo rustc --release -- --print native-static-libs':"
            echo "$NATIVE_STATIC_LIBS"
          } > "$name/NATIVE-STATIC-LIBS.txt"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "archive contents:"
          tar tzf "$name.tar.gz"

      - name: Package the archive (Windows)
        if: runner.os == 'Windows'
        run: |
          set -eux
          out=bindings/c/target/release
          name="goatd-c-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp bindings/c/include/goatd.h LICENSE docs/THIRD-PARTY.md "$name"
          cp "$out/goatd_c.dll" "$out/goatd_c.dll.lib" "$out/goatd_c.lib" "$name"
          {
            echo "System libraries needed when linking goatd_c.lib statically,"
            echo "from 'cargo rustc --release -- --print native-static-libs':"
            echo "$NATIVE_STATIC_LIBS"
          } > "$name/NATIVE-STATIC-LIBS.txt"
          7z a "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "archive contents:"
          7z l "$name.zip"

      # `--clobber` so re-running a job replaces its assets instead of
      # failing on the leftovers of the previous attempt.
      - name: Attach to the release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" goatd-c-"$TAG"-${{ matrix.target }}.* --clobber
