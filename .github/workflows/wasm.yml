name: Web build

# Builds the crate for wasm32-unknown-emscripten and uploads the page in
# bindings/wasm/ together with the module it loads. On main it also publishes
# the page to GitHub Pages; a pull request only builds.

on:
  push:
    branches: [main]
    paths:
      - "bindings/wasm/**"
      - "src/**"
      - "vendor/**"
      - "build.rs"
      - "Cargo.toml"
      - ".github/workflows/wasm.yml"
  pull_request:
    paths:
      - "bindings/wasm/**"
      - "src/**"
      - "vendor/**"
      - "build.rs"
      - "Cargo.toml"
      - ".github/workflows/wasm.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned: the SDK carries the clang and the libc++ the vendored C++20
  # FlowCutter is compiled with, so a build that worked keeps working.
  EMSDK_VERSION: 4.0.7

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `activate` writes the config the compiler reads; naming it in
      # EM_CONFIG is what carries the SDK into the later steps, alongside the
      # directory holding emcc itself.
      - name: Install the Emscripten SDK
        run: |
          set -eux
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EM_CONFIG=$RUNNER_TEMP/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Add the target
        run: rustup target add wasm32-unknown-emscripten

      # build.rs looks for a versioned g++ only when the target is Linux; for
      # this target it leaves the choice to `cc`, which these name outright.
      # The vendored FlowCutter throws and ffi.cpp catches, so the C++ has to
      # be compiled for the exception model rustc links with, which for this
      # target is Wasm EH. Compiled for the JavaScript one instead, every
      # translation unit that catches leaves `__resumeException` undefined.
      - name: Build
        working-directory: bindings/wasm
        env:
          CXX_wasm32_unknown_emscripten: em++
          AR_wasm32_unknown_emscripten: emar
          CXXFLAGS_wasm32_unknown_emscripten: -fwasm-exceptions
        run: cargo build --release

      - name: Assemble the page
        working-directory: bindings/wasm
        run: |
          set -eux
          out=target/wasm32-unknown-emscripten/release
          mkdir -p site
          cp index.html styles.css app.js worker.js logo.png mcc2025-track1-093.gr "$out/goatd.js" "$out/goatd.wasm" site/
          ls -l site

      # Proves the module decomposes, not just that it linked. The graph is
      # the 4-cycle with one chord, whose treewidth is 2.
      - name: Decompose a graph with the built module
        working-directory: bindings/wasm/site
        run: |
          cat > smoke.cjs <<'EOF'
          const createGoatd = require("./goatd.js");
          createGoatd().then((goatd) => {
            const gr = "p tw 4 5\n1 2\n2 3\n3 4\n4 1\n1 3\n";
            const pointer = goatd.ccall(
              "goatd_decompose",
              "number",
              ["string", "number", "number", "number"],
              [gr, 0, 0, 0],
            );
            const td = goatd.UTF8ToString(pointer);
            goatd.ccall("goatd_string_free", null, ["number"], [pointer]);
            console.log(td);
            // "s td <bags> <largest bag> <vertices>"; width is one less than
            // the largest bag.
            const header = td.split("\n", 1)[0].split(" ");
            if (header[0] !== "s" || header[1] !== "td" || Number(header[3]) - 1 !== 2) {
              console.error("expected a decomposition of width 2");
              process.exit(1);
            }
          });
          EOF
          node smoke.cjs
          rm smoke.cjs

      - name: Check formatting
        if: ${{ !cancelled() }}
        working-directory: bindings/wasm
        run: cargo fmt --check

      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: bindings/wasm
        env:
          CXX_wasm32_unknown_emscripten: em++
          AR_wasm32_unknown_emscripten: emar
          CXXFLAGS_wasm32_unknown_emscripten: -fwasm-exceptions
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Upload the page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goatd-web
          path: bindings/wasm/site
          if-no-files-found: ignore

  # GitHub Pages serves the gh-pages branch, whose root is the solver
  # comparison. This job replaces only solve/ there, so the page is at
  # https://tractables.github.io/goatd/solve/ and tracks main.
  deploy:
    needs: wasm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/download-artifact@v4
        with:
          name: goatd-web
          path: site

      - name: Publish the page under solve/
        working-directory: gh-pages
        run: |
          set -eux
          rm -rf solve
          cp -r ../site solve
          git add -A solve
          if git diff --cached --quiet; then
            echo "solve/ is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish the solver page from $GITHUB_SHA"
          git push
