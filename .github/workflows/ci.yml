name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The vendored FlowCutter is C++20, compiled by build.rs with each
      # runner's own toolchain — g++ on Linux, Apple clang on macOS, MSVC on
      # Windows; nothing else has to be installed.

      # `--locked` builds against the committed `Cargo.lock` and fails rather
      # than resolving something else. This job runs whatever toolchain the
      # runner image ships; the `msrv` job below checks the declared minimum.
      - name: Build
        run: cargo build --release --locked

      # After the build so a crate that does not compile is reported as a
      # compile error rather than as lint failures. `--all-targets` carries
      # the lint past the library to the solver, the tests and the build
      # script; `-D warnings` makes a new finding fail the job. Once, on
      # Linux: the lint set does not vary with the platform, and the other
      # runners are here for the compile and the tests.
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --all-targets --locked

      - name: Test the documentation examples
        run: cargo test --release --doc --locked

      # Every other test job is `--release`, which compiles the debug
      # assertions out, so without this one the crate's invariant checks never
      # run anywhere. Release speed with the assertions live; once, on Linux,
      # since the assertions do not vary with the platform.
      - name: Test with debug assertions
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -C debug-assertions
        run: cargo test --release --all-targets --locked

      # Warnings denied: a broken intra-doc link fails the job rather than
      # shipping.
      - name: Build documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      # `package` builds the crate as a consumer receives it: from the
      # `include` allowlist alone, unpacked into a fresh directory — the only
      # step that notices a new source directory falling outside the list.
      - name: Package
        if: runner.os == 'Linux'
        run: cargo package --locked

      # Each binding wraps the core it sits beside and carries the core's
      # version, as does the citation metadata. Catch a bump that reached one
      # file and not another here, rather than at the tag that would ship the
      # mismatch.
      - name: Check that every crate and the citation carry the same version
        if: runner.os == 'Linux'
        run: .github/scripts/check-versions.sh

  # The `rust-version` in Cargo.toml is a promise to anyone building against
  # an older toolchain. This job pins the declared minimum and compiles the
  # crate with it, so raising the real minimum fails here instead of in a
  # downstream build.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Read from the manifest rather than repeated here, so a copy that fell
      # behind `rust-version` cannot leave this job checking the old floor.
      - name: Read the declared minimum from Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install the declared minimum toolchain
        run: rustup toolchain install ${{ env.MSRV }} --profile minimal --no-self-update

      # `--all-targets` so the binary, the tests and the examples are compiled
      # at the floor too: a newer construct in the CLI would otherwise break
      # `cargo install` for a consumer on the declared minimum and leave this
      # job green. The crate has no dev-dependencies, so it costs one more
      # target set and nothing else.
      - name: Check
        run: cargo +${{ env.MSRV }} check --locked --all-targets

  # A 32-bit target is where a `usize` narrower than a `u64` shows up: index
  # arithmetic that fits on the runners can wrap here, and a draw that reads
  # `usize` picks different vertices. Both have happened. The i686 binaries
  # run on the x86_64 runner, so this is a test run and not only a compile.
  thirty-two-bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the target and a 32-bit C++ toolchain
        run: |
          rustup target add i686-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Test
        env:
          # `g++-multilib` gives the 32-bit headers to the runner's default
          # `g++` and to no other, while `build.rs` would otherwise take the
          # newest versioned one on PATH, which does not have them.
          GOATD_CXX: g++
        run: cargo test --release --all-targets --locked --target i686-unknown-linux-gnu
