<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goatd in the browser</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  p { color: #444; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; }
  textarea { height: 14rem; }
  pre { height: 18rem; overflow: auto; background: #f4f4f4; padding: 0.6rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: end; margin: 0.8rem 0; }
  label { display: block; font-size: 13px; color: #444; }
  input { width: 7rem; }
  #status { margin-left: auto; color: #444; }
</style>
</head>
<body>

<h1>goatd in the browser</h1>
<p>Paste a PACE <code>.gr</code> graph and get the <code>.td</code> tree
decomposition back. The solver runs in this tab; nothing is uploaded.</p>

<textarea id="graph" spellcheck="false">c the 4-cycle with one chord
p tw 4 5
1 2
2 3
3 4
4 1
1 3
</textarea>

<div class="controls">
  <label>Construction
    <select id="order">
      <option value="0">min-fill</option>
      <option value="1">min-degree</option>
      <option value="2">nested dissection</option>
      <option value="3">FlowCutter</option>
      <option value="4">portfolio</option>
    </select>
  </label>
  <label>Seed <input id="seed" type="number" min="0" value="0"></label>
  <label>Budget (ms) <input id="budget" type="number" min="0" value="1000"></label>
  <button id="run" disabled>Decompose</button>
  <span id="status">loading…</span>
</div>

<pre id="output"></pre>

<script src="goatd.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let goatd = null;

createGoatd().then((module) => {
  goatd = module;
  $("run").disabled = false;
  $("status").textContent = "ready";
}).catch((e) => {
  $("status").textContent = "failed to load: " + e;
});

// The call blocks this tab for as long as the construction runs, so hand the
// browser a frame to repaint the status in before starting it.
$("run").addEventListener("click", () => {
  $("status").textContent = "running…";
  $("run").disabled = true;
  requestAnimationFrame(() => setTimeout(decompose, 0));
});

function decompose() {
  const started = performance.now();
  const pointer = goatd.ccall(
    "goatd_decompose",
    "number",
    ["string", "number", "number", "number"],
    [$("graph").value, Number($("order").value), Number($("seed").value), Number($("budget").value)],
  );
  const text = goatd.UTF8ToString(pointer);
  goatd.ccall("goatd_string_free", null, ["number"], [pointer]);
  const elapsed = Math.round(performance.now() - started);

  $("output").textContent = text;
  $("status").textContent = text.startsWith("s td ") ? summary(text, elapsed) : "failed";
  $("run").disabled = false;
}

// "s td <bags> <largest bag> <vertices>" is the first line of a PACE .td.
function summary(td, elapsed) {
  const header = td.split("\n", 1)[0].split(/\s+/);
  return `width ${Number(header[3]) - 1}, ${header[2]} bags, ${elapsed} ms`;
}
</script>

</body>
</html>
